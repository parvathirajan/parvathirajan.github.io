name: CI & Deploy to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Git Config
        run: |
          git config --global user.name "Parvathirajan Natarajan"
          git config --global user.email "parvathi_rajan@hotmail.com"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Audit Dependencies
        run: yarn audit

      - name: Type Check
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build Project
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: gh-pages
          build_dir: build
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
